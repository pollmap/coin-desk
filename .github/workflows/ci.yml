name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python scripts/verify_custom.py
      - run: npm run check
      - run: npm run test:recovery
      - run: npm run test:server
      - run: npm run build
      - run: npm run build:storybook -- --disable-telemetry
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          COIN_DESK_FIXTURE_TRACE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
            work/browser-checks/
          retention-days: 7
      - run: python scripts/check_docs.py
      - run: python scripts/check_brand.py
      - run: python scripts/package_release.py
      - run: npm run package:vps
      - run: docker build --tag coin-desk:ci .
      - run: python scripts/container_smoke.py
