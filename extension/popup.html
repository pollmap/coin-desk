<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>Coin Desk 가져오기</title
  ><link rel="stylesheet" href="popup.css" />
  <main>
    <h1>Coin Desk 자료 가져오기</h1>
    <p>로그인한 X 화면에서 읽은 자료를 기기에 보관합니다.</p>
    <label
      >읽을 범위<select id="mode">
        <option value="post">현재 게시물</option>
        <option value="bookmarks">북마크</option>
        <option value="account">계정</option>
        <option value="list">리스트 구성원 → 계정</option>
      </select></label
    ><label>X 주소<input id="url" type="url" placeholder="https://x.com/token_night" /></label
    ><button id="start">새 탭에서 읽기 시작</button>
    <div><button id="stop">중지</button><button id="resume">재개</button></div>
    <hr />
    <label><input type="checkbox" id="images" />이미지도 함께 가져오기</label
    ><button id="send">연결한 Coin Desk에 전송</button><button id="export">JSONL로 저장</button
    ><button id="local">로컬 개발 자료함 연결 허용</button>
    <pre id="status" role="status"></pre>
    <small
      >Coin Desk 자료함에서 ‘Chrome 연결’을 먼저 누르세요. 창을 닫아도 수집 탭이 열려 있으면 작업이
      이어집니다. 브라우저가 닫히면 재개가 필요합니다.</small
    >
  </main>
  <script type="module" src="popup.js"></script>
</html>
